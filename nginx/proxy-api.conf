# Reenvío a la API. Se incluye en cada location de /api/.
# $api_esquema y $api_upstream los define el server (plantilla, variables
# API_ESQUEMA y API_UPSTREAM):
#   - Worker de Cloudflare:      https + api-fiestas.TU-SUBDOMINIO.workers.dev
#   - contenedor en el homelab:  http  + api-fiestas:8787
# Con http las directivas proxy_ssl_* se ignoran.

proxy_pass $api_esquema://$api_upstream;
proxy_ssl_server_name on;
proxy_ssl_name $api_upstream;
proxy_set_header Host $api_upstream;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto https;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_connect_timeout 5s;
# proxy_read_timeout va en cada location: las subidas necesitan más.
