# Cabeceras de seguridad comunes. Se incluyen en cada location que añade
# cabeceras propias, porque en nginx un add_header dentro de un location
# anula TODOS los heredados del server.
#
# CSP: sin 'unsafe-inline' en scripts ni estilos. El JS nunca escribe
# style="" en el HTML (los colores van por clase .t-<tipo>).
#  - img-src: tiles de los proveedores de mapa, fotos de perfil de Google y
#    blob: para la vista previa de la foto elegida antes de subirla.
#  - frame-src: SÓLO los reproductores de música. Si la API admite un
#    servicio nuevo, se añade aquí y en public/js/musica.js.
#  - form-action: Google, por el login.
# scripts/dev.mjs lee ESTE fichero, así que en local se prueba el mismo CSP
# que en producción.

add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org https://api.maptiler.com https://tiles.stadiamaps.com https://*.googleusercontent.com; connect-src 'self'; frame-src https://open.spotify.com https://www.youtube-nocookie.com https://w.soundcloud.com https://embed.music.apple.com; media-src 'none'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com; manifest-src 'self'; worker-src 'none'" always;
