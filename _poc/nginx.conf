# ======================================================================
# Rate limiting. Debe ir fuera del bloque server (contexto http).
# OJO: depende de que real_ip funcione, si no limitaría a todo internet
# como si fuese un solo cliente (el reverse_proxy).
# ======================================================================
limit_req_zone  $binary_remote_addr zone=kedada_req:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=kedada_conn:10m;

# ======================================================================
# User-agents que no queremos. Frena a los escáneres perezosos y a los
# rastreadores de IA que sí se identifican. Un bot malicioso puede
# falsear el user-agent, así que esto es un filtro, no una defensa.
# ======================================================================
map $http_user_agent $bloqueado {
    default                 0;
    ""                      1;   # sin user-agent: casi siempre script
    "~*(nikto|sqlmap|nmap|masscan|nuclei|wpscan|dirbuster|gobuster)"  1;
    "~*(zgrab|censys|shodan|internetmeasurement)"                     1;
    "~*(semrush|ahrefs|mj12bot|dotbot|blexbot|petalbot|serpstat)"     1;
    "~*(gptbot|ccbot|claudebot|anthropic-ai|bytespider|amazonbot)"    1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;          # no anunciar la versión de nginx

    # ------------------------------------------------------------------
    # IP real detrás del reverse_proxy. Como el contenedor no publica
    # puertos, lo único que puede llegar aquí es el proxy, así que
    # confiamos en los rangos privados de Docker.
    # ------------------------------------------------------------------
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ------------------------------------------------------------------
    # Límites. burst absorbe ráfagas legítimas (el navegador pide varias
    # cosas de golpe); nodelay las sirve ya en vez de encolarlas.
    # ------------------------------------------------------------------
    limit_req  zone=kedada_req burst=40 nodelay;
    limit_conn kedada_conn 20;
    limit_req_status 429;
    limit_conn_status 429;

    client_max_body_size 1m;    # no se suben ficheros al server: sobra de largo

    # ------------------------------------------------------------------
    # Solo lectura. Cualquier POST/PUT/DELETE contra un sitio estático es
    # un sondeo. 444 = cerrar la conexión sin responder nada.
    # ------------------------------------------------------------------
    if ($request_method !~ ^(GET|HEAD)$) { return 444; }
    if ($bloqueado) { return 444; }

    # ------------------------------------------------------------------
    # Rutas que solo piden los escáneres buscando WordPress, credenciales
    # o repos expuestos. Cortarlas limpia muchísimo los logs.
    # ------------------------------------------------------------------
    location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php) { return 444; }
    location ~* ^/(\.env|\.git|\.aws|\.ssh|config\.json|credentials) { return 444; }
    location ~* ^/(phpmyadmin|pma|adminer|cgi-bin|vendor|autoload) { return 444; }
    location ~* \.(php|asp|aspx|jsp|cgi|sh|sql|bak|old|swp)$ { return 444; }
    location ~ /\. { return 444; }   # cualquier fichero oculto

    # ------------------------------------------------------------------
    # Compresión.
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # ------------------------------------------------------------------
    # Cabeceras.
    # X-Robots-Tag es lo que de verdad mantiene la app fuera de Google:
    # robots.txt pide que no rastreen, esto ordena que no indexen.
    # OJO nginx: un add_header dentro de un location anula TODOS los del
    # server. Por eso aquí no hay ningún location con add_header.
    # ------------------------------------------------------------------
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://unpkg.com;
        style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com data:;
        img-src 'self' data: blob: https:;
        media-src 'self' data: blob: https:;
        connect-src 'self' https:;
        frame-ancestors 'none';
        base-uri 'self';
        form-action 'self';
    " always;

    # ------------------------------------------------------------------
    # robots.txt. Usamos default_type en vez de add_header para no
    # cargarnos las cabeceras de arriba.
    # ------------------------------------------------------------------
    location = /robots.txt {
        default_type text/plain;
        access_log off;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /healthz {
        default_type text/plain;
        access_log off;
        return 200 "ok\n";
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
