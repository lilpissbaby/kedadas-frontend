<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Kedada · Fiestas cerca de ti</title>

<!-- Leaflet (mapa) vía CDN -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Tipografías -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0B0E1A;
    --bg-elevated:#12162A;
    --surface:rgba(22,26,48,0.78);
    --surface-solid:#161A30;
    --border:rgba(255,255,255,0.08);
    --text:#F1EFFB;
    --text-muted:#8B8FB3;
    --text-faint:#585C82;
    --c-ayuntamiento:#2DD4BF;
    --c-bar:#FFA53D;
    --c-discoteca:#FF3D8A;
    --c-pub:#38BDF8;
    --c-manifestacion:#FF4D4D;
    --c-fiesta:#A78BFA;
    --radius-lg:28px;
    --radius-md:18px;
    --radius-sm:12px;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overscroll-behavior:none;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
  }
  button, input, select, textarea{font-family:inherit;}
  h1,h2,h3,strong,.brand strong{font-family:'Space Grotesk',system-ui,sans-serif;}

  /* ---------- MAPA ---------- */
  #map{position:fixed;inset:0;z-index:0;background:var(--bg);}
  /* Las tiles de CARTO ya son oscuras: solo las teñimos ligeramente de azul
     para que peguen con el fondo de la app. */
  .leaflet-tile-pane{filter:sepia(0.45) hue-rotate(185deg) saturate(1.15) brightness(0.92);}
  /* Las de OpenStreetMap (respaldo) son claras: hay que invertirlas. */
  .leaflet-tile-pane .tiles-osm{filter:invert(1) hue-rotate(185deg) brightness(0.92) contrast(0.92);}
  .leaflet-control-attribution{background:rgba(11,14,26,0.7) !important;color:var(--text-faint) !important;font-size:10px !important;}
  .leaflet-control-attribution a{color:var(--text-muted) !important;}
  .leaflet-control-zoom{display:none;}

  /* ---------- TOPBAR ---------- */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:20;
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 10px;
    background:linear-gradient(to bottom, rgba(11,14,26,0.92), rgba(11,14,26,0));
    pointer-events:none;
  }
  .brand{display:flex;align-items:center;gap:10px;pointer-events:auto;}
  .brand-mark{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(135deg, var(--c-discoteca), var(--c-fiesta));
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:16px;color:#0B0E1A;flex-shrink:0;
  }
  .brand-text{display:flex;flex-direction:column;line-height:1.15;}
  .brand-text strong{font-size:17px;font-weight:700;letter-spacing:0.2px;}
  .brand-text span{font-size:11px;color:var(--text-muted);}

  .locate-btn{
    pointer-events:auto;
    width:40px;height:40px;border-radius:50%;
    background:var(--surface);backdrop-filter:blur(10px);
    border:1px solid var(--border);color:var(--text);
    font-size:17px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .locate-btn:active{transform:scale(0.94);}

  /* ---------- CHIPS DE FILTRO ---------- */
  .chips{
    position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);left:0;right:0;z-index:19;
    display:flex;gap:8px;padding:0 16px;overflow-x:auto;scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    display:flex;align-items:center;gap:6px;
    padding:8px 14px;border-radius:999px;
    background:var(--surface);backdrop-filter:blur(10px);
    border:1px solid var(--border);
    color:var(--text-muted);font-size:13px;font-weight:500;
    cursor:pointer;transition:background .15s, border-color .15s, color .15s;
    white-space:nowrap;
  }
  .chip.active{
    color:var(--text);
    border-color:var(--cat-color, var(--text));
    background:color-mix(in srgb, var(--cat-color, var(--text)) 22%, var(--surface-solid));
  }

  /* ---------- BURBUJAS EN EL MAPA ---------- */
  .bubble-wrap{background:none;border:none;}
  .bubble{
    width:42px;height:42px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;line-height:1;
    background:radial-gradient(circle at 32% 28%, color-mix(in srgb, var(--cat-color) 40%, var(--bg-elevated)), var(--bg-elevated));
    border:2px solid var(--cat-color);
    cursor:pointer;
    animation:pulseRing 2.4s ease-out infinite;
  }
  .bubble.has-photo{background:none;overflow:hidden;}
  .bubble.has-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  @keyframes pulseRing{
    0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--cat-color) 45%, transparent);}
    65%{box-shadow:0 0 0 13px transparent;}
    100%{box-shadow:0 0 0 0 transparent;}
  }
  @media (prefers-reduced-motion:reduce){
    .bubble{animation:none;}
  }
  .me-dot{width:16px;height:16px;border-radius:50%;background:#5AD1FF;border:3px solid #0B0E1A;box-shadow:0 0 0 0 rgba(90,209,255,.6);animation:pulseMe 2.2s ease-out infinite;}
  @keyframes pulseMe{0%{box-shadow:0 0 0 0 rgba(90,209,255,.55);}70%{box-shadow:0 0 0 16px transparent;}100%{box-shadow:0 0 0 0 transparent;}}

  /* ---------- HOJA INFERIOR (LISTA) ---------- */
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:18;
    background:var(--surface-solid);
    border-top:1px solid var(--border);
    border-radius:22px 22px 0 0;
    box-shadow:0 -12px 30px rgba(0,0,0,0.35);
    transform:translateY(calc(100% - 118px));
    transition:transform .32s cubic-bezier(.2,.8,.2,1);
    max-height:72vh;
    display:flex;flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .sheet.expanded{transform:translateY(0);}
  .sheet-handle{
    width:100%;padding:10px 0 6px;background:none;border:none;cursor:pointer;
    display:flex;justify-content:center;
  }
  .sheet-handle::after{content:'';width:36px;height:4px;border-radius:2px;background:var(--text-faint);}
  .sheet-header{display:flex;align-items:baseline;justify-content:space-between;padding:2px 20px 10px;}
  .sheet-header h2{margin:0;font-size:16px;font-weight:600;}
  .sheet-count{font-size:12px;color:var(--text-muted);}
  .event-list{overflow-y:auto;padding:0 12px 18px;display:flex;flex-direction:column;gap:8px;}

  .event-card{
    display:flex;align-items:center;gap:12px;
    padding:10px 12px;border-radius:var(--radius-md);
    background:rgba(255,255,255,0.03);
    border:1px solid var(--border);
    cursor:pointer;transition:background .15s;
  }
  .event-card:active{background:rgba(255,255,255,0.07);}
  .event-card .mini-bubble{
    width:34px;height:34px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:15px;
    background:color-mix(in srgb, var(--cat-color) 30%, var(--bg-elevated));
    border:1.5px solid var(--cat-color);
  }
  .event-card .mini-bubble.has-photo{background:none;overflow:hidden;}
  .event-card .mini-bubble.has-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .event-card .info{min-width:0;flex:1;}
  .event-card .info .title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .event-card .info .meta{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .event-card .dist{font-size:12px;color:var(--text-faint);flex-shrink:0;}

  .empty-state{padding:30px 10px;text-align:center;color:var(--text-muted);font-size:13px;}

  /* ---------- FAB ---------- */
  .fab{
    position:fixed;right:16px;bottom:132px;z-index:19;
    width:56px;height:56px;border-radius:50%;
    background:linear-gradient(135deg, var(--c-discoteca), var(--c-fiesta));
    border:none;color:#0B0E1A;font-size:28px;font-weight:600;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 22px rgba(255,61,138,0.35);
    cursor:pointer;
  }
  .fab:active{transform:scale(0.95);}

  /* ---------- MODALES ---------- */
  .modal-overlay{
    position:fixed;inset:0;z-index:40;
    background:rgba(6,7,15,0.6);backdrop-filter:blur(2px);
    display:flex;align-items:flex-end;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .modal-overlay.open{opacity:1;pointer-events:auto;}
  .modal{
    width:100%;max-width:480px;
    background:var(--surface-solid);
    border:1px solid var(--border);
    border-radius:24px 24px 0 0;
    padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 22px);
    transform:translateY(24px);transition:transform .25s cubic-bezier(.2,.8,.2,1);
    max-height:86vh;overflow-y:auto;
  }
  .modal-overlay.open .modal{transform:translateY(0);}
  .modal-close{
    position:absolute;top:16px;right:16px;
    width:32px;height:32px;border-radius:50%;
    background:rgba(255,255,255,0.06);border:none;color:var(--text);
    font-size:16px;cursor:pointer;
  }

  /* -- Detalle de fiesta -- */
  .detail-modal{position:relative;}
  .detail-ring{
    width:74px;height:74px;border-radius:50%;margin:4px auto 14px;
    display:flex;align-items:center;justify-content:center;
    background:conic-gradient(from -40deg, var(--cat-color), color-mix(in srgb, var(--cat-color) 40%, #A78BFA), var(--cat-color));
    padding:3px;
  }
  .detail-ring-inner{
    width:100%;height:100%;border-radius:50%;background:var(--bg-elevated);
    display:flex;align-items:center;justify-content:center;font-size:30px;
  }
  /* Portada. Usamos "contain" sobre una copia desenfocada del propio cartel:
     así un cartel vertical se ve entero en vez de recortado, y una foto
     apaisada sigue llenando el hueco. */
  .detail-cover{
    position:relative;width:100%;aspect-ratio:4/3;
    border-radius:var(--radius-md);overflow:hidden;
    margin:0 0 14px;background:var(--bg-elevated);
  }
  .detail-cover .cover-blur{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;filter:blur(20px) brightness(0.5);transform:scale(1.25);
  }
  .detail-cover .cover-main{position:relative;width:100%;height:100%;object-fit:contain;display:block;}
  .detail-cover .cover-badge{
    position:absolute;left:10px;bottom:10px;
    display:flex;align-items:center;gap:6px;
    padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;
    background:rgba(11,14,26,0.72);backdrop-filter:blur(8px);
    color:var(--cat-color);border:1px solid color-mix(in srgb, var(--cat-color) 55%, transparent);
  }
  .detail-modal h3{text-align:center;margin:0 0 6px;font-size:19px;}
  .cat-pill{
    display:block;margin:0 auto 14px;width:fit-content;
    padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;
    background:color-mix(in srgb, var(--cat-color) 22%, transparent);
    color:var(--cat-color);border:1px solid color-mix(in srgb, var(--cat-color) 55%, transparent);
  }
  .detail-meta{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text-muted);margin-bottom:14px;}
  .detail-meta div{display:flex;gap:8px;align-items:flex-start;}
  .detail-desc{font-size:14px;line-height:1.5;color:var(--text);margin-bottom:18px;}

  .play-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius-md);background:rgba(255,255,255,0.04);border:1px solid var(--border);margin-bottom:12px;}
  .play-btn{
    width:42px;height:42px;border-radius:50%;flex-shrink:0;border:none;cursor:pointer;
    background:var(--cat-color);color:#0B0E1A;font-size:15px;
    display:flex;align-items:center;justify-content:center;
  }
  .eq{display:flex;align-items:flex-end;gap:3px;height:20px;flex:1;}
  .eq span{width:3px;background:var(--cat-color);border-radius:2px;height:4px;opacity:.45;}
  .eq.playing span{animation:eqBounce 0.9s ease-in-out infinite;opacity:1;}
  .eq.playing span:nth-child(1){animation-delay:0s;}
  .eq.playing span:nth-child(2){animation-delay:.12s;}
  .eq.playing span:nth-child(3){animation-delay:.24s;}
  .eq.playing span:nth-child(4){animation-delay:.36s;}
  .eq.playing span:nth-child(5){animation-delay:.48s;}
  @keyframes eqBounce{0%,100%{height:4px;}50%{height:18px;}}
  .play-label{font-size:12px;color:var(--text-muted);flex-shrink:0;}

  .route-btn{
    display:block;text-align:center;text-decoration:none;
    padding:12px;border-radius:var(--radius-md);
    background:rgba(255,255,255,0.05);border:1px solid var(--border);
    color:var(--text);font-size:14px;font-weight:600;
  }

  /* -- Crear fiesta -- */
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px;}
  .field input[type=text], .field input[type=url], .field textarea{
    width:100%;padding:11px 12px;border-radius:var(--radius-sm);
    background:rgba(255,255,255,0.04);border:1px solid var(--border);
    color:var(--text);font-size:14px;resize:vertical;
  }
  .field input:focus, .field textarea:focus{outline:2px solid var(--c-discoteca);outline-offset:1px;}
  .cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .cat-opt{
    padding:10px 6px;border-radius:var(--radius-sm);text-align:center;cursor:pointer;
    background:rgba(255,255,255,0.03);border:1.5px solid var(--border);
    font-size:12px;color:var(--text-muted);
  }
  .cat-opt .em{display:block;font-size:18px;margin-bottom:3px;}
  .cat-opt.selected{color:var(--text);border-color:var(--cat-color);background:color-mix(in srgb, var(--cat-color) 20%, transparent);}
  .cover-picker{display:flex;gap:10px;align-items:center;}
  .cover-preview{
    width:64px;height:64px;border-radius:var(--radius-sm);flex-shrink:0;
    background:rgba(255,255,255,0.04);border:1.5px dashed var(--border);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;color:var(--text-faint);overflow:hidden;
  }
  .cover-preview img{width:100%;height:100%;object-fit:cover;display:block;}
  .cover-picker-actions{flex:1;display:flex;flex-direction:column;gap:6px;}
  .cover-file-btn{
    padding:9px 12px;border-radius:var(--radius-sm);cursor:pointer;
    background:rgba(255,255,255,0.05);border:1.5px solid var(--border);
    color:var(--text);font-size:13px;text-align:center;
  }
  .cover-hint{font-size:11px;color:var(--text-faint);}
  .loc-row{display:flex;gap:8px;}
  .loc-btn{
    flex:1;padding:11px 8px;border-radius:var(--radius-sm);
    background:rgba(255,255,255,0.04);border:1.5px solid var(--border);
    color:var(--text-muted);font-size:12.5px;cursor:pointer;text-align:center;
  }
  .loc-btn.selected{color:var(--text);border-color:var(--c-fiesta);background:color-mix(in srgb, var(--c-fiesta) 18%, transparent);}
  .loc-status{font-size:12px;color:var(--text-faint);margin-top:8px;min-height:16px;}
  .submit-btn{
    width:100%;padding:14px;border:none;border-radius:var(--radius-md);
    background:linear-gradient(135deg, var(--c-discoteca), var(--c-fiesta));
    color:#0B0E1A;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;
  }
  .submit-btn:active{transform:scale(0.99);}

  /* ---------- TOAST ---------- */
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%, 20px);
    background:var(--surface-solid);border:1px solid var(--border);
    padding:11px 18px;border-radius:999px;font-size:13px;
    z-index:60;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
    max-width:88vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>

<div id="map" role="application" aria-label="Mapa de fiestas cercanas"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">K</span>
    <div class="brand-text">
      <strong>Kedada</strong>
      <span>Fiestas cerca de ti</span>
    </div>
  </div>
  <button class="locate-btn" id="locateBtn" aria-label="Centrar en mi ubicación">◎</button>
</header>

<nav class="chips" id="chips"></nav>

<section class="sheet" id="sheet">
  <button class="sheet-handle" id="sheetHandle" aria-label="Mostrar u ocultar la lista"></button>
  <div class="sheet-header">
    <h2>Cerca de ti</h2>
    <span class="sheet-count" id="sheetCount">0 fiestas</span>
  </div>
  <div class="event-list" id="eventList"></div>
</section>

<button class="fab" id="fabBtn" aria-label="Crear una fiesta">+</button>

<!-- Modal de detalle -->
<div class="modal-overlay" id="detailOverlay">
  <div class="modal detail-modal" id="detailModal">
    <button class="modal-close" id="detailClose" aria-label="Cerrar">✕</button>
    <div class="detail-cover" id="detailCover" hidden>
      <img class="cover-blur" id="detailCoverBlur" alt="">
      <img class="cover-main" id="detailCoverMain" alt="">
      <span class="cover-badge" id="detailCoverBadge"></span>
    </div>
    <div class="detail-ring" id="detailRing"><div class="detail-ring-inner" id="detailEmoji"></div></div>
    <h3 id="detailTitle"></h3>
    <span class="cat-pill" id="detailCatPill"></span>
    <div class="detail-meta">
      <div>📍 <span id="detailAddress"></span></div>
      <div>🕒 <span id="detailTime"></span></div>
      <div id="detailDistRow">📏 <span id="detailDist"></span></div>
    </div>
    <p class="detail-desc" id="detailDesc"></p>
    <div class="play-row">
      <button class="play-btn" id="playBtn">▶</button>
      <div class="eq" id="eq"><span></span><span></span><span></span><span></span><span></span></div>
      <span class="play-label" id="playLabel">canción del creador</span>
    </div>
    <a class="route-btn" id="routeBtn" href="#" target="_blank" rel="noopener">Cómo llegar →</a>
  </div>
</div>

<!-- Modal de creación -->
<div class="modal-overlay" id="createOverlay">
  <div class="modal" id="createModal">
    <button class="modal-close" id="createClose" aria-label="Cerrar">✕</button>
    <h3 style="margin-top:4px;">Crear una fiesta</h3>
    <div class="field">
      <label for="fTitulo">Título</label>
      <input type="text" id="fTitulo" placeholder="Ej. Terraza especial en Bar Ferro" maxlength="60">
    </div>
    <div class="field">
      <label>Tipo</label>
      <div class="cat-grid" id="catGrid"></div>
    </div>
    <div class="field">
      <label>Ubicación</label>
      <div class="loc-row">
        <button type="button" class="loc-btn" id="useMyLoc">📍 Mi ubicación actual</button>
        <button type="button" class="loc-btn" id="pickOnMap">🗺️ Marcar en el mapa</button>
      </div>
      <div class="loc-status" id="locStatus">Sin ubicación seleccionada</div>
    </div>
    <div class="field">
      <label>Foto de portada</label>
      <div class="cover-picker">
        <div class="cover-preview" id="coverPreview">🖼️</div>
        <div class="cover-picker-actions">
          <label class="cover-file-btn" for="fCoverFile">Elegir una imagen</label>
          <input type="file" id="fCoverFile" accept="image/*" hidden>
          <input type="url" id="fCoverUrl" placeholder="…o pega una URL de imagen">
        </div>
      </div>
      <div class="cover-hint">Cartel, foto del local, lo que quieras. Opcional.</div>
    </div>
    <div class="field">
      <label for="fDesc">Descripción</label>
      <textarea id="fDesc" rows="3" placeholder="¿Qué se cuece? Horario, ambiente, entrada..." maxlength="200"></textarea>
    </div>
    <div class="field">
      <label for="fAudio">Enlace a una canción (opcional)</label>
      <input type="url" id="fAudio" placeholder="https://... (mp3, ogg...). Si lo dejas vacío, generamos una melodía única">
    </div>
    <button class="submit-btn" id="submitCreate">Publicar fiesta</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   KEDADA — Proof of concept
   -------------------------------------------------------------------------
   Un único archivo estático (HTML + CSS + JS) pensado para subirse tal cual
   a un servidor nginx y abrirse desde el móvil. Sin build, sin dependencias
   de servidor: solo usa CDNs públicos (Leaflet + Google Fonts) y APIs del
   propio navegador (Geolocation, Web Audio).

   CÓMO CONECTAR VUESTRA API REAL
   -------------------------------------------------------------------------
   1. Rellenad CONFIG.API_BASE con la URL base de vuestra API (p.ej.

// Plantillas de URL por proveedor. {key} se sustituye por CONFIG.TILE_API_KEY.
// La atribución de CARTO y OpenStreetMap debe quedar visible: es la condición
// del tier gratuito, y el control de atribución de Leaflet ya la muestra.
const TILE_PROVIDERS = {
  carto: {
    url: 'https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png?key={key}',
    options: { subdomains: 'abcd', maxZoom: 20 },
    attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
    needsKey: true,
  },
  maptiler: {
    url: 'https://api.maptiler.com/maps/streets-v2-dark/{z}/{x}/{y}{r}.png?key={key}',
    options: { maxZoom: 20 },
    attribution: '&copy; MapTiler &copy; OpenStreetMap contributors',
    needsKey: true,
  },
  stadia: {
    url: 'https://tiles.stadiamaps.com/tiles/alidade_smooth_dark/{z}/{x}/{y}{r}.png?api_key={key}',

    needsKey: true,

  // Respaldo sin clave. Ojo: los servidores de OSM son voluntarios y rechazan

  // Sus tiles son claras, así que se invierten con CSS (clase .tiles-osm).

    needsKey: false,
  },
};

function haversine(lat1, lng1, lat2, lng2){
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function formatDist(m){
  if (m == null) return '';
  if (m < 1000) return Math.round(m) + ' m';
  return (m/1000).toFixed(1) + ' km';
}

// Los títulos y las URL los mete el usuario, así que los escapamos antes de

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, c => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
  ));
}
const escapeAttr = escapeHtml;

function toast(msg){
  const el = document.getElementById('toast');

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

/* ---------------------------------------------------------------------
   "CANCIÓN DEL CREADOR" — sintetizador simple
   Cada fiesta tiene un pequeño motivo musical generado de forma
   determinista a partir de su título (a modo de placeholder), salvo que
   el creador haya indicado un audioUrl real, en cuyo caso se reproduce
   ese archivo con <audio>.
   --------------------------------------------------------------------- */

function seedFromString(str){
  let h = 0;
  for (let i = 0; i < str.length; i++){ h = (h << 5) - h + str.charCodeAt(i); h |= 0; }
  return Math.abs(h) || 1;
}

function motifFor(event){
  if (motifCache.has(event.id)) return motifCache.get(event.id);
  const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 493.88, 523.25]; // pentatónica-ish, agradable
  let seed = seedFromString(event.titulo + event.id);
  const len = 5 + (seed % 3);
  const notes = [];
  for (let i = 0; i < len; i++){
    seed = (seed * 9301 + 49297) % 233280;
    notes.push(scale[seed % scale.length]);
  }
  motifCache.set(event.id, notes);
  return notes;
}

function getAudioCtx(){
  if (!window.__ctx) window.__ctx = new (window.AudioContext || window.webkitAudioContext)();
  return window.__ctx;
}

function playMotif(notes, onDone){
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  const noteDur = 0.22;
  notes.forEach((freq, i) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    const start = now + i * noteDur;
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(0.16, start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, start + noteDur * 0.95);
    osc.connect(gain).connect(ctx.destination);
    osc.start(start);
    osc.stop(start + noteDur);
    activeOscillators.push(osc);
  });
  const totalMs = notes.length * noteDur * 1000;
  if (onDone) setTimeout(onDone, totalMs + 30);
}

function stopMotif(){
  const ctx = window.__ctx;
  if (ctx){
    const now = ctx.currentTime;
    activeOscillators.forEach(osc => { try { osc.stop(now); } catch(e){} });
  }
  activeOscillators = [];
}

function togglePlay(){
  const btn = document.getElementById('playBtn');
  const eq = document.getElementById('eq');
  const label = document.getElementById('playLabel');
  const isPlaying = btn.classList.contains('is-playing');

  if (isPlaying){
    stopPlayback();
    return;
  }

  const event = currentDetailEvent;
  if (!event) return;

  btn.classList.add('is-playing');
  btn.textContent = '❚❚';
  eq.classList.add('playing');
  label.textContent = event.audioUrl ? 'sonando...' : 'melodía de ejemplo';

  if (event.audioUrl){
    audioEl = new Audio(event.audioUrl);
    audioEl.play().catch(() => { toast('No se pudo reproducir el audio'); stopPlayback(); });
    audioEl.onended = stopPlayback;
  } else {
    const notes = motifFor(event);
    playMotif(notes, stopPlayback);
  }
}

function stopPlayback(){
  const btn = document.getElementById('playBtn');
  const eq = document.getElementById('eq');
  const label = document.getElementById('playLabel');
  if (!btn) return;
  btn.classList.remove('is-playing');
  btn.textContent = '▶';
  eq.classList.remove('playing');
  label.textContent = 'canción del creador';
  if (audioEl){ audioEl.pause(); audioEl = null; }
  stopMotif();
}

function initMap(){
  map = L.map('map', { zoomControl: false, attributionControl: true }).setView(REUS, 14);

  // Por defecto usamos las tiles oscuras de CARTO en vez de las de
  // openstreetmap.org: los servidores de OSM son voluntarios y bloquean
  // (403 "Access blocked") las peticiones sin cabecera Referer, que es lo que
  // pasa al abrir el HTML con file:// o desde algunos WebView del móvil.
  const provider = TILE_PROVIDERS[CONFIG.TILE_PROVIDER] || TILE_PROVIDERS.carto;

  if (provider.needsKey && !CONFIG.TILE_API_KEY){
    console.warn(`El proveedor "${CONFIG.TILE_PROVIDER}" necesita una API key en CONFIG.TILE_API_KEY.`);
  }

  const url = provider.url.replace('{key}', encodeURIComponent(CONFIG.TILE_API_KEY || ''));

  const tiles = L.tileLayer(url, {
    ...provider.options,
    attribution: provider.attribution,
  }).addTo(map);

  // Si el proveedor falla (key inválida, cuota agotada, sin red...), avisamos
  // una sola vez y caemos a OpenStreetMap, que no necesita clave.
  let tileErrorShown = false;
  tiles.on('tileerror', () => {
    if (tileErrorShown) return;
    tileErrorShown = true;
    if (provider !== TILE_PROVIDERS.osm){
      toast('Falla el proveedor de mapas, cambiando a OpenStreetMap');
      map.removeLayer(tiles);
      L.tileLayer(TILE_PROVIDERS.osm.url, {
        ...TILE_PROVIDERS.osm.options,
        attribution: TILE_PROVIDERS.osm.attribution,
      }).addTo(map);
    } else {
      toast('No se cargan las tiles del mapa. Sirve la página por http, no con file://');
    }
  });

  markerLayer = L.layerGroup().addTo(map);

  map.on('click', (e) => {
    if (pickingLocation) setPickedLocation(e.latlng.lat, e.latlng.lng);
  });
}

function bubbleIcon(cat, portada){
  const meta = CATEGORIES[cat];
  const inner = portada
    ? `<img src="${escapeAttr(portada)}" alt="">`
    : meta.emoji;
  return L.divIcon({
    className: 'bubble-wrap',
    html: `<div class="bubble${portada ? ' has-photo' : ''}" style="--cat-color:${meta.color}">${inner}</div>`,
    iconSize: [42, 42],
    iconAnchor: [21, 21],
  });
}

function renderMarkers(list){
  markerLayer.clearLayers();
  list.forEach(ev => {
    const marker = L.marker([ev.lat, ev.lng], { icon: bubbleIcon(ev.categoria, ev.portada) });
    marker.on('click', () => openDetail(ev));
    marker.addTo(markerLayer);
  });
}

function placeUserMarker(){
  if (!userLatLng) return;
  if (userMarker) map.removeLayer(userMarker);
  userMarker = L.marker(userLatLng, {
    icon: L.divIcon({ className: 'bubble-wrap', html: '<div class="me-dot"></div>', iconSize: [16,16], iconAnchor:[8,8] }),
    zIndexOffset: 1000,
  }).addTo(map);
}

// En el PoC no se consulta la geolocalización del dispositivo: siempre
// estamos en REUS. Para la app real, aquí iría navigator.geolocation.
function centerOnUser(withToast){
  userLatLng = REUS;
  placeUserMarker();
  map.flyTo(userLatLng, 15);
  refresh();
  if (withToast) toast('Estás en el centro de Reus');
}

/* ---------------------------------------------------------------------
   FILTROS Y LISTA
   --------------------------------------------------------------------- */

function renderChips(){
  const wrap = document.getElementById('chips');
  wrap.innerHTML = '';
  Object.entries(CATEGORIES).forEach(([key, meta]) => {
    const chip = document.createElement('button');
    chip.className = 'chip' + (activeFilters.has(key) ? ' active' : '');
    chip.style.setProperty('--cat-color', meta.color);
    chip.textContent = `${meta.emoji} ${meta.label}`;
    chip.addEventListener('click', () => {
      if (activeFilters.has(key)) activeFilters.delete(key); else activeFilters.add(key);
      renderChips();
      refresh();
    });
    wrap.appendChild(chip);
  });
}

function withDistance(list){
  return list.map(ev => ({
    ...ev,
    _dist: userLatLng ? haversine(userLatLng[0], userLatLng[1], ev.lat, ev.lng) : null,
  }));
}

function renderList(list){
  const withDist = withDistance(list).sort((a, b) => {
    if (a._dist == null || b._dist == null) return a.titulo.localeCompare(b.titulo);
    return a._dist - b._dist;
  });

  document.getElementById('sheetCount').textContent =
    `${withDist.length} fiesta${withDist.length === 1 ? '' : 's'}`;

  const container = document.getElementById('eventList');
  container.innerHTML = '';

  if (withDist.length === 0){
    container.innerHTML = '<div class="empty-state">No hay fiestas con estos filtros ahora mismo. Prueba a activar más categorías o crea la tuya con el botón +.</div>';
    return;
  }

  withDist.forEach(ev => {
    const meta = CATEGORIES[ev.categoria];
    const card = document.createElement('div');
    card.className = 'event-card';
    card.innerHTML = `
      <div class="mini-bubble${ev.portada ? ' has-photo' : ''}" style="--cat-color:${meta.color}">${
        ev.portada ? `<img src="${escapeAttr(ev.portada)}" alt="">` : meta.emoji
      }</div>
      <div class="info">
        <div class="title">${escapeHtml(ev.titulo)}</div>
        <div class="meta">${meta.label} · ${escapeHtml(ev.horario)}</div>
      </div>
      <div class="dist">${ev._dist != null ? formatDist(ev._dist) : ''}</div>
    `;
    card.addEventListener('click', () => { map.flyTo([ev.lat, ev.lng], 16); openDetail(ev); });
    container.appendChild(card);
  });
}

function refresh(){
  const filtered = DATA.filter(ev => activeFilters.has(ev.categoria));
  renderMarkers(filtered);
  renderList(filtered);
}

/* ---------------------------------------------------------------------
   MODAL DE DETALLE
   --------------------------------------------------------------------- */

function openDetail(ev){
  currentDetailEvent = ev;
  const meta = CATEGORIES[ev.categoria];
  const dist = userLatLng ? haversine(userLatLng[0], userLatLng[1], ev.lat, ev.lng) : null;

  const cover = document.getElementById('detailCover');
  const ring = document.getElementById('detailRing');
  if (ev.portada){
    document.getElementById('detailCoverBlur').src = ev.portada;
    document.getElementById('detailCoverMain').src = ev.portada;
    const badge = document.getElementById('detailCoverBadge');
    badge.textContent = `${meta.emoji} ${meta.label}`;
    badge.style.setProperty('--cat-color', meta.color);
    cover.hidden = false;
    ring.hidden = true;
  } else {
    cover.hidden = true;
    ring.hidden = false;
    ring.style.setProperty('--cat-color', meta.color);
    document.getElementById('detailEmoji').textContent = meta.emoji;
  }

  document.getElementById('detailTitle').textContent = ev.titulo;
  const pill = document.getElementById('detailCatPill');
  pill.textContent = meta.label;
  pill.style.setProperty('--cat-color', meta.color);
  // Con portada la categoría ya sale en la chapa sobre la imagen.
  pill.hidden = !!ev.portada;
  document.getElementById('detailAddress').textContent = ev.direccion;
  document.getElementById('detailTime').textContent = ev.horario;
  const distRow = document.getElementById('detailDistRow');
  if (dist != null){ distRow.style.display = 'flex'; document.getElementById('detailDist').textContent = formatDist(dist) + ' de ti'; }
  else { distRow.style.display = 'none'; }
  document.getElementById('detailDesc').textContent = ev.descripcion;
  document.getElementById('routeBtn').href = `https://www.google.com/maps/dir/?api=1&destination=${ev.lat},${ev.lng}`;
  document.getElementById('playBtn').style.setProperty('background', meta.color);
  document.querySelector('.eq').style.setProperty('--cat-color', meta.color);

  stopPlayback();
  document.getElementById('detailOverlay').classList.add('open');
}

function closeDetail(){
  stopPlayback();
  document.getElementById('detailOverlay').classList.remove('open');
  currentDetailEvent = null;
}

/* ---------------------------------------------------------------------
   MODAL DE CREACIÓN
   --------------------------------------------------------------------- */

function renderCatGrid(){
  const grid = document.getElementById('catGrid');
  grid.innerHTML = '';
  Object.entries(CATEGORIES).forEach(([key, meta]) => {
    const opt = document.createElement('div');
    opt.className = 'cat-opt';
    opt.style.setProperty('--cat-color', meta.color);
    opt.innerHTML = `<span class="em">${meta.emoji}</span>${meta.label}`;
    opt.addEventListener('click', () => {
      selectedCategory = key;
      document.querySelectorAll('.cat-opt').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
    });
    grid.appendChild(opt);
  });
}

function setPickedLocation(lat, lng){
  selectedLatLng = [lat, lng];
  if (tempMarker) map.removeLayer(tempMarker);
  tempMarker = L.marker([lat, lng]).addTo(map);
  document.getElementById('locStatus').textContent = `Ubicación marcada: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
  pickingLocation = false;
  document.getElementById('pickOnMap').classList.remove('selected');
}

function setCoverPreview(src){
  selectedCover = src || '';
  const box = document.getElementById('coverPreview');
  box.innerHTML = selectedCover ? `<img src="${escapeAttr(selectedCover)}" alt="">` : '🖼️';
}

function openCreate(){
  document.getElementById('fTitulo').value = '';
  document.getElementById('fDesc').value = '';
  document.getElementById('fAudio').value = '';
  document.getElementById('fCoverUrl').value = '';
  document.getElementById('fCoverFile').value = '';
  setCoverPreview('');
  selectedCategory = null;
  selectedLatLng = null;
  pickingLocation = false;
  document.getElementById('locStatus').textContent = 'Sin ubicación seleccionada';
  document.getElementById('useMyLoc').classList.remove('selected');
  document.getElementById('pickOnMap').classList.remove('selected');
  document.querySelectorAll('.cat-opt').forEach(o => o.classList.remove('selected'));
  document.getElementById('createOverlay').classList.add('open');
}

function closeCreate(){
  pickingLocation = false;
  if (tempMarker){ map.removeLayer(tempMarker); tempMarker = null; }
  document.getElementById('createOverlay').classList.remove('open');
}

function submitCreate(){
  const titulo = document.getElementById('fTitulo').value.trim();
  const desc = document.getElementById('fDesc').value.trim();
  const audioUrl = document.getElementById('fAudio').value.trim();

  if (!titulo){ toast('Ponle un título a tu fiesta'); return; }
  if (!selectedCategory){ toast('Elige un tipo de fiesta'); return; }
  if (!selectedLatLng){ toast('Indica dónde es la fiesta'); return; }

  const newEvent = {
    id: Date.now(),
    titulo,
    categoria: selectedCategory,
    lat: selectedLatLng[0],
    lng: selectedLatLng[1],
    direccion: 'Marcado por el creador en el mapa',
    horario: 'Ahora',
    descripcion: desc || 'Sin descripción.',
    audioUrl,
    portada: selectedCover,
  };

  // TODO API: sustituir el unshift de abajo por una llamada real, por ejemplo:
  // fetch(`${CONFIG.API_BASE}/eventos`, {
  //   method: 'POST',
  //   headers: { 'Content-Type': 'application/json' },
  //   body: JSON.stringify(newEvent),
  // }).then(r => r.json()).then(saved => { DATA.unshift(saved); refresh(); });

  DATA.unshift(newEvent);
  if (!activeFilters.has(selectedCategory)) activeFilters.add(selectedCategory);
  renderChips();
  refresh();
  closeCreate();
  toast('¡Tu fiesta ya está en el mapa! 🎉');
}

/* ---------------------------------------------------------------------
   CARGA DE EVENTOS (mock o API real)
   --------------------------------------------------------------------- */

async function loadEvents(){
  if (CONFIG.API_BASE){
    try {
      // TODO API: ajustar la ruta si vuestro endpoint se llama distinto
      const res = await fetch(`${CONFIG.API_BASE}/eventos`);
      if (!res.ok) throw new Error('Respuesta no OK');
      DATA = await res.json();
    } catch (err){
      console.warn('No se pudo conectar con la API, usando datos de ejemplo.', err);
      DATA = MOCK_EVENTS.slice();
    }
  } else {
    DATA = MOCK_EVENTS.slice();
  }
  refresh();
}

/* ---------------------------------------------------------------------
   EVENTOS DE INTERFAZ
   --------------------------------------------------------------------- */

function initUI(){
  renderChips();
  renderCatGrid();

  document.getElementById('locateBtn').addEventListener('click', () => centerOnUser(true));

  document.getElementById('sheetHandle').addEventListener('click', () => {
    sheetExpanded = !sheetExpanded;
    document.getElementById('sheet').classList.toggle('expanded', sheetExpanded);
  });

  document.getElementById('fabBtn').addEventListener('click', openCreate);
  document.getElementById('createClose').addEventListener('click', closeCreate);
  document.getElementById('createOverlay').addEventListener('click', (e) => { if (e.target.id === 'createOverlay') closeCreate(); });
  document.getElementById('submitCreate').addEventListener('click', submitCreate);

  document.getElementById('detailClose').addEventListener('click', closeDetail);
  document.getElementById('detailOverlay').addEventListener('click', (e) => { if (e.target.id === 'detailOverlay') closeDetail(); });
  document.getElementById('playBtn').addEventListener('click', togglePlay);

  // Portada: o se sube un archivo del móvil (se lee como data URL, todo en
  // memoria) o se pega una URL. Lo último que toques manda.
  document.getElementById('fCoverFile').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (file.size > 4 * 1024 * 1024){
      toast('La imagen pesa demasiado, prueba con una más ligera');
      e.target.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      document.getElementById('fCoverUrl').value = '';
      setCoverPreview(reader.result);
    };
    reader.onerror = () => toast('No se pudo leer la imagen');
    reader.readAsDataURL(file);
  });

  document.getElementById('fCoverUrl').addEventListener('input', (e) => {
    const url = e.target.value.trim();
    if (url) document.getElementById('fCoverFile').value = '';
    setCoverPreview(url);
  });

  document.getElementById('useMyLoc').addEventListener('click', () => {
    selectedLatLng = userLatLng;
    document.getElementById('locStatus').textContent = 'Usando tu ubicación actual (centro de Reus)';
    document.getElementById('useMyLoc').classList.add('selected');
    document.getElementById('pickOnMap').classList.remove('selected');
    if (tempMarker){ map.removeLayer(tempMarker); tempMarker = null; }
  });

  document.getElementById('pickOnMap').addEventListener('click', () => {
    pickingLocation = true;
    document.getElementById('pickOnMap').classList.add('selected');
    document.getElementById('useMyLoc').classList.remove('selected');
    document.getElementById('locStatus').textContent = 'Toca un punto del mapa para colocar tu fiesta';
    closeCreateTemporarilyToPick();
  });
}

// Al elegir "marcar en el mapa" ocultamos el modal un instante para poder tocar el mapa,
// y lo reabrimos automáticamente en cuanto el usuario marca el punto.
function closeCreateTemporarilyToPick(){
  document.getElementById('createOverlay').classList.remove('open');
  const check = setInterval(() => {
    if (!pickingLocation){
      clearInterval(check);
      document.getElementById('createOverlay').classList.add('open');
    }
  }, 200);
}

/* ---------------------------------------------------------------------
   ARRANQUE
   --------------------------------------------------------------------- */

window.addEventListener('DOMContentLoaded', () => {
  initMap();
  initUI();
  loadEvents();
  placeUserMarker(); // posición fija en Reus, sin pedir permisos al navegador
});
</script>
